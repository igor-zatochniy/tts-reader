name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  scan-secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0

      - name: Run Gitleaks action
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITLEAKS_ENABLE_COMMENTS: false

      - name: Scan full Git history for secrets
        run: gitleaks detect --source . --verbose

  verify:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: go.mod
          cache: false

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24

      - name: Check formatting
        shell: pwsh
        run: |
          $files = gofmt -l $(git ls-files '*.go')
          if ($files) {
            $files
            exit 1
          }

      - name: Validate OpenAPI
        run: npx --yes @redocly/cli@2.38.0 lint api/openapi.yaml

      - name: Generate OpenAPI models
        run: go generate ./internal/httpapi

      - name: Verify generated OpenAPI models
        shell: pwsh
        run: |
          $changes = git status --porcelain -- internal/httpapi/types.gen.go
          if ($changes) {
            $changes
            throw "Generated OpenAPI models are out of date. Run: go generate ./internal/httpapi"
          }

      - name: Verify modules
        run: go mod verify

      - name: Test release publication recovery
        shell: pwsh
        run: ./scripts/Test-PublishRelease.ps1

      - name: Test
        run: go test ./...

      - name: Shuffled tests
        run: go test -count=1 -shuffle=on ./...

      - name: Race test
        run: go test -race ./...

      - name: Playback stress tests
        run: go test -race -count=30 ./internal/playback ./internal/events

      - name: Vet
        run: go vet ./...

      - name: Install staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@2026.1

      - name: Staticcheck
        run: staticcheck ./...

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.5.0

      - name: Govulncheck
        run: govulncheck ./...

      - name: Build
        run: go build ./...

  fuzz:
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        target: [FuzzChunkReader, FuzzUTF8Boundary, FuzzProgressLoad, FuzzStartPosition]
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: go.mod
          cache: false

      - name: Coverage-guided fuzzing
        run: go test . -run '^$' -fuzz='^${{ matrix.target }}$' -fuzztime=2m -parallel=2 -timeout=10m

  publish:
    needs: [verify, scan-secrets, fuzz]
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: go.mod
          cache: false

      - name: Build Windows executable
        shell: pwsh
        env:
          GOOS: windows
          GOARCH: amd64
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          go build -trimpath -ldflags "-s -w" -o dist/tts-reader-windows-amd64.exe .

      - name: Create SHA256 checksum
        shell: pwsh
        run: |
          $exe = "dist/tts-reader-windows-amd64.exe"
          $checksum = "dist/tts-reader-windows-amd64.exe.sha256"
          $hash = (Get-FileHash -Algorithm SHA256 $exe).Hash.ToLowerInvariant()
          "$hash  tts-reader-windows-amd64.exe" | Set-Content -Path $checksum -Encoding ascii -NoNewline

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/Publish-Release.ps1 -Repository $env:GITHUB_REPOSITORY -Tag $env:GITHUB_REF_NAME -Commit $env:GITHUB_SHA
